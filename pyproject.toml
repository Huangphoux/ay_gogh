[project]
name = "ay-gogh"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fsrs[optimizer]>=6.3.1",
    "mistletoe>=1.5.1",
    "passlib>=1.7.4",
    "python-frontmatter>=1.1.0",
    "requests>=2.33.1",
    "starhtml[debug]>=0.5.19",
    "starlette-cramjam>=0.6.0",
    "starlette==0.52.1",
]

[tool.ruff.lint]
select = ["F401"]
ignore = ["F403", "F405"]

[tool.ty.rules]
unresolved-reference = "ignore"

[dependency-groups]
dev = [
    "ruff>=0.15.2",
    "ty>=0.0.18",
]
